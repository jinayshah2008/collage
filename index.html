<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>lost braincells</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0000;
      min-height: 100vh;
      padding: 2.5rem 2rem 3rem;
      font-family: sans-serif;
    }

    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      gap: 14px;
    }

    #loginScreen h2 {
      font-size: 58px;
      font-weight: 400;
      color: #080000;
      -webkit-text-stroke: 1.8px #cc0000;
      text-shadow: 0 0 8px #cc0000, 0 0 18px #880000;
      letter-spacing: 6px;
      margin-bottom: 1.2rem;
    }

    .login-input {
      background: #0a0000;
      border: 1px solid #cc0000;
      box-shadow: 0 0 6px #cc000066;
      color: #ff6666;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 8px;
      width: 260px;
      outline: none;
      letter-spacing: 1px;
    }

    .login-input::placeholder { color: #cc000044; }
    .login-input:focus { box-shadow: 0 0 10px #cc0000aa; }

    .login-err {
      color: #cc000088;
      font-size: 12px;
      letter-spacing: 1px;
      min-height: 16px;
    }

    #appScreen { display: none; }

    .heading-wrap { text-align: center; margin-bottom: 2rem; }

    .heading {
      font-size: 58px;
      font-weight: 400;
      color: #080000;
      -webkit-text-stroke: 1.8px #cc0000;
      text-shadow: 0 0 8px #cc0000, 0 0 18px #880000;
      letter-spacing: 6px;
      line-height: 1;
    }

    .top-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 1px solid #cc0000;
      box-shadow: 0 0 6px #cc000088, 0 0 12px #88000055;
      color: #cc0000;
      font-size: 13px;
      padding: 8px 24px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: box-shadow 0.2s, color 0.2s;
    }

    .btn:hover {
      box-shadow: 0 0 10px #cc0000bb, 0 0 20px #88000088;
      color: #ff3333;
    }

    .btn.active {
      background: #cc000022;
      color: #ff4444;
      box-shadow: 0 0 12px #cc0000cc, 0 0 24px #880000aa;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 780px;
      margin: 0 auto;
    }

    .frame {
      aspect-ratio: 4/3;
      border-radius: 18px;
      background: rgba(180, 10, 10, 0.04);
      border: 1px solid #cc0000;
      box-shadow:
        0 0 1px 1px #cc0000,
        0 0 4px 2px #aa0000,
        0 0 10px 3px #88000077,
        inset 0 0 6px #88000022;
      position: relative;
      overflow: visible;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
    }

    .frame:hover {
      box-shadow:
        0 0 2px 1px #ff2222,
        0 0 6px 3px #cc0000,
        0 0 14px 5px #880000aa,
        inset 0 0 10px #88000033;
    }

    .frame.dragging { opacity: 0.4; transform: scale(0.96); }
    .frame.drag-over {
      box-shadow: 0 0 0 2px #ff2222, 0 0 16px #cc0000cc;
      transform: scale(1.03);
    }

    .frame-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
    }

    .frame img, .frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      cursor: pointer;
    }

    .frame .plus {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 2;
      pointer-events: none;
    }

    .frame .plus-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: all;
      width: 80%;
    }

    .frame .plus-btns button {
      background: transparent;
      border: 1px solid #cc000066;
      color: #cc000099;
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
      width: 100%;
    }

    .frame .plus-btns button:hover {
      border-color: #cc0000;
      color: #ff3333;
      box-shadow: 0 0 8px #cc000066;
    }

    .frame .uploading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cc0000aa;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 3;
      background: #0a000088;
      border-radius: 18px;
    }

    .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      font-size: 32px;
      color: #ffffff99;
      text-shadow: 0 0 10px #000;
    }

    .delete-btn {
      display: none;
      position: absolute;
      top: -10px;
      right: -10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #1a0000;
      border: 1.5px solid #cc0000;
      box-shadow: 0 0 6px #cc0000;
      color: #ff3333;
      font-size: 14px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: box-shadow 0.15s;
    }

    .delete-btn:hover { box-shadow: 0 0 12px #ff0000; background: #2a0000; }

    .edit-mode .frame { cursor: grab; }
    .edit-mode .delete-btn { display: flex; }
    .edit-mode .frame .plus-btns { pointer-events: none; opacity: 0.3; }

    .edit-hint {
      display: none;
      text-align: center;
      color: #cc000077;
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .edit-mode .edit-hint { display: block; }

    .add-btn-wrap {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .visitor-tag {
      text-align: center;
      color: #cc000055;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000cc;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #viewer.open { display: flex; }

    #viewerBox {
      background: #0a0000;
      border: 1px solid #cc0000;
      box-shadow: 0 0 30px #cc000066;
      border-radius: 16px;
      width: 80vw;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #viewerMedia {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }

    #viewerMedia img, #viewerMedia video {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
    }

    #viewerControls {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      flex-shrink: 0;
    }

    #viewerControls button {
      background: transparent;
      border: 1px solid #cc0000;
      box-shadow: 0 0 6px #cc000066;
      color: #cc0000;
      font-size: 11px;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    #viewerControls button:hover {
      box-shadow: 0 0 10px #cc0000aa;
      color: #ff3333;
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <h2>𝓣𝓱𝓮-𝓰𝓻𝓮𝓪𝓽-𝓭𝓲𝓷𝓸𝓼𝓪𝓾𝓻𝓼</h2>
    <input class="login-input" id="nameInput" type="text" placeholder="your name" />
    <input class="login-input" id="passInput" type="password" placeholder="password" />
    <button class="btn" id="loginBtn">enter</button>
    <div class="login-err" id="loginErr"></div>
  </div>

  <div id="appScreen">
    <div class="heading-wrap">
      <span class="heading">𝓣𝓱𝓮-𝓰𝓻𝓮𝓪𝓽-𝓭𝓲𝓷𝓸𝓼𝓪𝓾𝓻𝓼</span>
    </div>
    <div class="visitor-tag" id="visitorTag"></div>
    <div class="top-bar">
      <button class="btn" id="addBtn">+ add frame</button>
      <button class="btn" id="editBtn">✦ edit</button>
      <button class="btn" id="leaveBtn">leave</button>
    </div>
    <div class="edit-hint">drag to rearrange · tap ✕ to delete</div>
    <div class="grid" id="grid"></div>
    <div class="add-btn-wrap" id="editAddWrap" style="display:none;">
      <button class="btn" id="editAddBtn">+ add frame</button>
    </div>
  </div>

  <div id="viewer">
    <div id="viewerBox">
      <div id="viewerMedia"></div>
      <div id="viewerControls">
        <button id="viewerClose">✕ close</button>
        <button id="viewerDownload">↓ download</button>
        <button id="viewerFullscreen">⛶ fullscreen</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" />
  <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" style="display:none" />

  <script>
    const SUPABASE_URL = 'https://zuhfvcgfyszaxjjsaxdf.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_fJqVmyDvTpyfBVa1qiKZ6Q_whEaoLAO';
    const BASE    = `${SUPABASE_URL}/functions/v1`;
    const SESSION = 'badboy-secret-session-2024';

    // supabase client only for direct storage uploads
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const call = (fn, body) => fetch(`${BASE}/${fn}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-token': SESSION },
      body: JSON.stringify(body)
    }).then(r => r.json());

    let visitorName = '';
    let loginTime   = null;
    let editMode    = false;
    let dragSrc     = null;
    let leftAlready = false;
    let activeFrame = null;
    let viewerUrl   = '';

    const fileInput   = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeFrame) return;
      await uploadMedia(file, activeFrame.frame, activeFrame.media, activeFrame.plus);
      fileInput.value = '';
    });

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !activeFrame) return;
      await uploadMedia(file, activeFrame.frame, activeFrame.media, activeFrame.plus);
      cameraInput.value = '';
    });

    // ── VIEWER ────────────────────────────────────────────
    const viewer      = document.getElementById('viewer');
    const viewerBox   = document.getElementById('viewerBox');
    const viewerMedia = document.getElementById('viewerMedia');

    function openViewer(url, type) {
      viewerUrl = url;
      viewerMedia.innerHTML = '';
      if (type === 'video') {
        const v = document.createElement('video');
        v.src = url; v.controls = true; v.autoplay = true;
        viewerMedia.appendChild(v);
      } else {
        const img = document.createElement('img');
        img.src = url;
        viewerMedia.appendChild(img);
      }
      viewer.classList.add('open');
    }

    function closeViewer() {
      viewer.classList.remove('open');
      viewerMedia.innerHTML = '';
      viewerUrl = '';
    }

    document.getElementById('viewerClose').addEventListener('click', closeViewer);
    viewer.addEventListener('click', (e) => { if (e.target === viewer) closeViewer(); });

    document.getElementById('viewerDownload').addEventListener('click', () => {
      if (!viewerUrl) return;
      const a = document.createElement('a');
      a.href = viewerUrl;
      a.download = viewerUrl.split('/').pop();
      a.target = '_blank';
      a.click();
    });

    document.getElementById('viewerFullscreen').addEventListener('click', () => {
      if (viewerBox.requestFullscreen) viewerBox.requestFullscreen();
      else if (viewerBox.webkitRequestFullscreen) viewerBox.webkitRequestFullscreen();
    });

    // ── LOGIN ─────────────────────────────────────────────
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('passInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const name = document.getElementById('nameInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const err  = document.getElementById('loginErr');

      if (!name) { err.textContent = 'enter your name'; return; }
      err.textContent = 'checking...';

      try {
        const { correct } = await call('check-password', { password: pass });
        if (!correct) { err.textContent = 'wrong password'; return; }
      } catch(e) {
        err.textContent = 'connection error, try again'; return;
      }

      visitorName = name;
      loginTime   = new Date();
      leftAlready = false;
      err.textContent = '';

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display   = 'block';
      document.getElementById('visitorTag').textContent    = `welcome, ${name}`;

      call('notify', {
        subject: `lost braincells — ${name} just logged in`,
        html: `<p><b>${name}</b> entered the gallery.</p><p>Time: ${loginTime.toLocaleString()}</p>`
      });

      await loadFrames();
      window.addEventListener('beforeunload', handleLeave);
    }

    document.getElementById('leaveBtn').addEventListener('click', () => {
      doLeave();
      document.getElementById('appScreen').style.display   = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('nameInput').value = '';
      document.getElementById('passInput').value = '';
      document.getElementById('loginErr').textContent = '';
      document.getElementById('grid').innerHTML = '';
      window.removeEventListener('beforeunload', handleLeave);
    });

    function handleLeave() { doLeave(); }

    function doLeave() {
      if (!visitorName || leftAlready) return;
      leftAlready = true;
      const mins = Math.round((new Date() - loginTime) / 60000);
      call('notify', {
        subject: `lost braincells — ${visitorName} logged out`,
        html: `<p><b>${visitorName}</b> left the gallery.</p><p>Time spent: <b>${mins} minute${mins !== 1 ? 's' : ''}</b></p>`
      });
      visitorName = '';
    }

    // ── LOAD FRAMES ───────────────────────────────────────
    async function loadFrames() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const { frames } = await call('gallery', { action: 'load' });
      if (!frames || frames.length === 0) {
        for (let i = 0; i < 6; i++) createFrame();
        return;
      }
      frames.forEach(row => createFrame(row));
    }

    function isVideo(url) {
      if (!url) return false;
      return /\.(mp4|mov|webm|avi|mkv|m4v)(\?|$)/i.test(url);
    }

    // ── CREATE FRAME ──────────────────────────────────────
    function createFrame(data = null) {
      const grid  = document.getElementById('grid');
      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.draggable = false;
      if (data?.id) frame.dataset.id = data.id;

      const inner = document.createElement('div');
      inner.className = 'frame-inner';

      const plus = document.createElement('div');
      plus.className = 'plus';

      const plusBtns = document.createElement('div');
      plusBtns.className = 'plus-btns';

      let media = null;

      const camBtn = document.createElement('button');
      camBtn.textContent = '📷 camera';
      camBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (editMode) return;
        activeFrame = { frame, media, plus };
        cameraInput.click();
      });

      const fileBtn = document.createElement('button');
      fileBtn.textContent = '🖼 img / 🎥 video';
      fileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (editMode) return;
        activeFrame = { frame, media, plus };
        fileInput.click();
      });

      plusBtns.appendChild(camBtn);
      plusBtns.appendChild(fileBtn);
      plus.appendChild(plusBtns);

      if (data?.image_url) {
        const url = data.image_url;
        if (isVideo(url)) {
          media = document.createElement('video');
          media.src = url;
          media.muted = true; media.loop = true; media.playsInline = true;
          media.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;cursor:pointer;';
          const pi = document.createElement('div');
          pi.className = 'play-icon'; pi.textContent = '▶';
          inner.appendChild(pi);
          media.addEventListener('click', (e) => { e.stopPropagation(); if (!editMode) openViewer(url, 'video'); });
        } else {
          media = document.createElement('img');
          media.src = url;
          media.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;cursor:pointer;';
          media.addEventListener('click', (e) => { e.stopPropagation(); if (!editMode) openViewer(url, 'image'); });
        }
        plus.style.display = 'none';
      }

      inner.appendChild(plus);
      if (media) inner.appendChild(media);

      const del = document.createElement('button');
      del.className = 'delete-btn'; del.textContent = '✕';
      del.addEventListener('click', async (e) => { e.stopPropagation(); await deleteFrame(frame); });

      frame.appendChild(inner);
      frame.appendChild(del);
      grid.appendChild(frame);
      setupDrag(frame);
      if (!data) saveNewFrame(frame);
    }

    async function saveNewFrame(frame) {
      const pos = [...document.getElementById('grid').children].indexOf(frame);
      const { frame: saved } = await call('gallery', { action: 'add', data: { position: pos } });
      if (saved) frame.dataset.id = saved.id;
    }

    // ── UPLOAD DIRECTLY TO STORAGE ────────────────────────
    async function uploadMedia(file, frame, oldMedia, plus) {
      const uploading = document.createElement('div');
      uploading.className = 'uploading';
      uploading.textContent = 'uploading...';
      frame.querySelector('.frame-inner').appendChild(uploading);

      const ext      = file.name.split('.').pop() || 'jpg';
      const fileType = file.type.startsWith('video') ? 'video' : 'image';
      const path     = `shared/${Date.now()}.${ext}`;

      // upload directly to Supabase Storage (no size limit via edge fn)
      const { error: upErr } = await sb.storage.from('photos').upload(path, file, {
        contentType: file.type
      });

      if (upErr) { uploading.textContent = 'failed'; console.error(upErr); return; }

      const { data: urlData } = sb.storage.from('photos').getPublicUrl(path);
      const url = urlData.publicUrl;

      uploading.remove();
      if (oldMedia) oldMedia.remove();
      frame.querySelector('.frame-inner').querySelectorAll('.play-icon').forEach(e => e.remove());

      const inner = frame.querySelector('.frame-inner');
      let newMedia;

      if (fileType === 'video') {
        newMedia = document.createElement('video');
        newMedia.src = url; newMedia.muted = true; newMedia.loop = true; newMedia.playsInline = true;
        newMedia.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;cursor:pointer;';
        const pi = document.createElement('div');
        pi.className = 'play-icon'; pi.textContent = '▶';
        inner.appendChild(pi);
        newMedia.addEventListener('click', (e) => { e.stopPropagation(); if (!editMode) openViewer(url, 'video'); });
      } else {
        newMedia = document.createElement('img');
        newMedia.src = url;
        newMedia.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;cursor:pointer;';
        newMedia.addEventListener('click', (e) => { e.stopPropagation(); if (!editMode) openViewer(url, 'image'); });
      }

      inner.appendChild(newMedia);
      plus.style.display = 'none';

      // notify via edge function
      call('notify', {
        subject: `lost braincells — ${visitorName} uploaded a ${fileType}`,
        html: fileType === 'video'
          ? `<p><b>${visitorName}</b> uploaded a video at ${new Date().toLocaleString()}.</p><p><a href="${url}">▶ Watch video</a></p>`
          : `<p><b>${visitorName}</b> uploaded a photo at ${new Date().toLocaleString()}.</p><p><img src="${url}" style="max-width:400px;" /></p>`
      });

      if (frame.dataset.id) {
        await call('gallery', { action: 'update', data: { id: frame.dataset.id, image_url: url } });
      }
    }

    async function deleteFrame(frame) {
      if (frame.dataset.id) await call('gallery', { action: 'delete', data: { id: frame.dataset.id } });
      frame.remove();
      await savePositions();
    }

    async function savePositions() {
      const frames = [...document.getElementById('grid').querySelectorAll('.frame')];
      const data   = frames.map((f, i) => ({ id: f.dataset.id, position: i })).filter(f => f.id);
      if (data.length) await call('gallery', { action: 'reorder', data: { frames: data } });
    }

    function setupDrag(frame) {
      frame.addEventListener('dragstart', (e) => {
        if (!editMode) return;
        dragSrc = frame;
        setTimeout(() => frame.classList.add('dragging'), 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      frame.addEventListener('dragend', async () => {
        frame.classList.remove('dragging');
        document.querySelectorAll('.frame').forEach(f => f.classList.remove('drag-over'));
        await savePositions();
      });
      frame.addEventListener('dragover', (e) => {
        if (!editMode) return;
        e.preventDefault();
        document.querySelectorAll('.frame').forEach(f => f.classList.remove('drag-over'));
        if (frame !== dragSrc) frame.classList.add('drag-over');
      });
      frame.addEventListener('drop', (e) => {
        if (!editMode || frame === dragSrc) return;
        e.preventDefault();
        frame.classList.remove('drag-over');
        const frames = [...document.getElementById('grid').querySelectorAll('.frame')];
        const srcIdx = frames.indexOf(dragSrc);
        const tgtIdx = frames.indexOf(frame);
        if (srcIdx < tgtIdx) document.getElementById('grid').insertBefore(dragSrc, frame.nextSibling);
        else document.getElementById('grid').insertBefore(dragSrc, frame);
      });
    }

    function toggleEdit() {
      editMode = !editMode;
      document.body.classList.toggle('edit-mode', editMode);
      const editBtn = document.getElementById('editBtn');
      editBtn.classList.toggle('active', editMode);
      document.getElementById('editAddWrap').style.display = editMode ? 'flex' : 'none';
      editBtn.textContent = editMode ? '✓ done' : '✦ edit';
      document.querySelectorAll('.frame').forEach(f => { f.draggable = editMode; });
    }

    document.getElementById('addBtn').addEventListener('click', () => createFrame());
    document.getElementById('editBtn').addEventListener('click', toggleEdit);
    document.getElementById('editAddBtn').addEventListener('click', () => createFrame());
  </script>
</body>
</html>
